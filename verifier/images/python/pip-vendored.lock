# The libraries the pip pinned in the Dockerfile (--pip-source) bundles in pip/_vendor (its
# vendor.txt at that commit) with the floors the Dockerfile raises applied: urllib3, msgpack and certifi.
# fix-pip-vendored.sh downloads exactly these, with --require-hashes, into a wheelhouse and
# runs the vendoring sync against that wheelhouse alone. Each pin lists only the files the
# sync may use: the pure-Python wheel, or for msgpack (which has none) the sdist it is built
# from. The script refuses to run when the names and versions here differ from the pip
# vendor.txt it edited, so a new pip pin or a new floor needs this file regenerated: see
# 'Bumping pip or Python in the python image' in verifier/contract.md, which has the command.
#
