# The CPython that runs semgrep in every image: python-build-standalone's `install_only_stripped`
# build for glibc Linux, one file per architecture, with the sha256 its release publishes in
# SHA256SUMS (https://github.com/astral-sh/python-build-standalone/releases). It is installed
# under /opt/semgrep, away from the image's own Python (which some images do not have at all),
# so a repository's commands see no new `python3` on their PATH.
#
# Format: `<sha256>  <file name>`. install-semgrep.sh --python VERSION+TAG looks the file up by
# name for the machine it runs on and refuses a download whose digest is not the listed one.
# To bump it, see 'Bumping semgrep' in verifier/contract.md.
#
