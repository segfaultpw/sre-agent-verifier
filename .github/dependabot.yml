version: 2
updates:
  # The runtime images (verifier/images/<runtime>: elixir, node, python, go, java, php).
  # Each pins its base by digest, so a base that gets a security fix is only ever picked
  # up when somebody changes the digest; this is that somebody, weekly, as one reviewed
  # pull request. The weekly rebuild (.github/workflows/verifier-images.yml) re-resolves
  # the digests itself in the meantime, so a fix is not held back by a pull request
  # waiting for review.
  - package-ecosystem: docker
    directories:
      - "/verifier/images/*"
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      verifier-images:
        patterns:
          - "*"
    ignore:
      # The Elixir image carries the same Elixir and Erlang the platform builds with, so
      # only patch and digest updates come through here. The image is elixir:X.Y.Z-otp-N-slim,
      # so the dependency is named elixir.
      - dependency-name: elixir
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Odd Node majors are never long-term support and drop tooling the image relies on
      # (Node 25 removed corepack, which the node image enables), so only the even, LTS
      # lines are proposed.
      - dependency-name: node
        versions:
          - ">= 25, < 26"
          - ">= 27, < 28"
          - ">= 29, < 30"
          - ">= 31, < 32"
      # The JDK image follows the long-term support releases (21, 25, 29, 33), never the
      # six-month ones in between. Its tag is maven:3-eclipse-temurin-JDK, and Dependabot
      # reads that as the version 3.JDK (the words are dropped), so the ranges are written
      # in that form: 3.22 to 3.24 is JDK 22 to 24, and so on.
      - dependency-name: maven
        versions:
          - ">= 3.22, < 3.25"
          - ">= 3.26, < 3.29"
          - ">= 3.30, < 3.33"
          - ">= 3.34, < 3.37"
      # 4-eclipse-temurin-21 reads as 4.21, a jump of Maven's own major version, which this
      # image does not take on by itself.
      - dependency-name: maven
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
